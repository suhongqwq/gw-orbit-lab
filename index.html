  &lt;p data-en=&quot;This educational toy model uses planar orbits and initially nonspinning bodies. The binary and three-body modes use Newtonian gravity with optional finite-order post-Newtonian corrections. The Schwarzschild mode follows a test particle in a fixed spacetime. The waveforms and merger animation are illustrative. Full numerical relativity lies outside the scope of the model.&quot;&gt;这是一个教学用的玩具模型，采用二维平面轨道，初始天体无自旋。双星和三体以牛顿引力为基础，可选有限阶后牛顿近似。Schwarzschild 模式计算固定时空中的试验粒子测地线。波形与并合动画用于定性演示，完整的数值相对论演化超出本模型范围。&lt;/p&gt;

&lt;style&gt;
/* Shared presentation layer. Simulation and persisted parameter schemas stay in their modules. */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
  --orbit-page: light-dark(#f5f6f8, #15191f);
  --orbit-surface: var(--background);
  --orbit-line: light-dark(#dce2e8, #343d48);
  --orbit-soft: light-dark(#f2f5f7, #222a33);
  --orbit-action: light-dark(#425d73, #b2cadc);
  --orbit-action-text: light-dark(#ffffff, #18242e);
  --orbit-secondary: light-dark(#64717e, #a8b3bf);
  --orbit-shadow: 0 3px 14px light-dark(#29384906, #00000014);
}
html &gt; body {
  --font-sans: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
  max-width: 1480px;
  margin: 0 auto;
  padding: 8px 20px 32px;
  background: var(--orbit-page) !important;
  font-family: var(--font-sans) !important;
}
:is(#binary-evolution, #emri-sandbox, #schwarzschild-sandbox) { font-size: 14px; line-height: 1.65; }
:is(#binary-evolution, #emri-sandbox, #schwarzschild-sandbox) .text-muted, .orbit-brand-note { color: var(--orbit-secondary); }
.orbit-navigation {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  grid-template-areas: &quot;brand modes language&quot;;
  align-items: center;
  gap: 14px 24px;
  padding-bottom: 20px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--orbit-line);

    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
<script>
(() => {
  const frame = document.getElementById('codex-visualization');
  const titles = {"zh-CN": "引力波轨道实验室", "en": "GW Orbit Lab"};
  window.addEventListener('message', event => {
    const {type, language} = event.data || {};
    if (event.source !== frame?.contentWindow || type !== 'orbit-document-language' ||
        !['zh-CN', 'en'].includes(language)) return;
    const title = titles[language];
    document.documentElement.lang = language;
    document.title = title;
    frame.title = title;
  });
})();
</script>
